# nginx site config for the VPS. Install one copy per environment:
#
#   sudo cp deploy/nginx/api.conf /etc/nginx/sites-available/superdive-prod
#   sudo ln -s /etc/nginx/sites-available/superdive-prod /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#
# then let certbot add TLS:
#   sudo certbot --nginx -d api.yourdomain.com
#
# For the dev copy, change server_name to api-dev.yourdomain.com and the
# proxy_pass port to 8081 (APP_HOST_PORT in .env.dev).

server {
	listen 80;
	server_name api.yourdomain.com;

	# Compose binds the app to 127.0.0.1 only, so this is the sole way in.
	location / {
		proxy_pass http://127.0.0.1:8080;

		proxy_http_version 1.1;
		proxy_set_header Host              $host;
		proxy_set_header X-Real-IP         $remote_addr;
		proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
		# Spring needs this to know the original request was HTTPS.
		proxy_set_header X-Forwarded-Proto $scheme;

		proxy_read_timeout 60s;
	}

	# File uploads - raise if the CRM accepts bigger attachments.
	client_max_body_size 20m;
}

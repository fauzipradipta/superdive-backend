# One compose file, three environments. Nothing environment-specific is written
# here - it all comes from the env file you point at:
#
#   docker compose --env-file .env.local up -d --build
#   docker compose --env-file .env.dev   up -d --build
#   docker compose --env-file .env.prod  up -d --build
#
# COMPOSE_PROJECT_NAME in that file namespaces the containers, network and
# volume, which is what lets dev and prod run on the same VPS.
#
# The env vars below override application*.properties - Spring gives environment
# variables higher precedence than the properties file, so nothing in src/ has
# to change. ${VAR:?message} means "fail fast if this is missing".

name: ${COMPOSE_PROJECT_NAME:-superdive}

services:

  mysql:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?set MYSQL_ROOT_PASSWORD in your env file}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-superdive}
    ports:
      # Bound to 127.0.0.1 on purpose: on a VPS a bare "3307:3306" would expose
      # the database to the whole internet, and Docker's iptables rules bypass ufw.
      # Only needed at all so you can point a SQL client at it over an SSH tunnel.
      - "127.0.0.1:${MYSQL_HOST_PORT:-3307}:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-p${MYSQL_ROOT_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 40s

  backend:
    build: .
    restart: unless-stopped
    depends_on:
      mysql:
        # Without this the app starts before MySQL accepts connections and dies.
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:?set SPRING_PROFILES_ACTIVE (local|dev|prod)}
      # Host is "mysql" - the service name on this project's compose network. NOT
      # localhost: inside a container localhost is the container itself.
      DB_URL: "jdbc:mysql://mysql:3306/${MYSQL_DATABASE:-superdive}?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC"
      DB_USERNAME: root
      DB_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET in your env file}
      JWT_EXPIRATION: ${JWT_EXPIRATION:-86400000}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:?set CORS_ALLOWED_ORIGINS in your env file}
    ports:
      # Loopback only - nginx on the host terminates TLS and proxies to this.
      - "127.0.0.1:${APP_HOST_PORT:-8080}:8080"

volumes:
  mysql_data:

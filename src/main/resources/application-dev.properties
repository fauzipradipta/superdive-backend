# Dev / staging environment - runs on the VPS, deployed from the `development`
# branch. Same shape as prod (everything comes from the environment, no
# fallbacks) so a problem shows up here and not in production. The only
# differences are noisier logging and a looser schema policy.
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

logging.level.com.example.superdive=DEBUG
logging.level.org.hibernate.SQL=DEBUG

# Full stack traces in API error responses - useful on staging, never in prod.
server.error.include-stacktrace=always
server.error.include-message=always

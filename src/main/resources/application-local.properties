# Local environment - your own machine, MySQL installed natively or in a
# standalone container on localhost:3306. Safe defaults everywhere so a fresh
# clone runs with no setup: this is the only profile allowed to hardcode values.
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/superdive?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:Jakarta1!}

# Not a secret - it never leaves your machine. dev and prod must supply a real
# one through JWT_SECRET or the app refuses to start.
jwt.secret=${JWT_SECRET:qWjWYCSdW4h/NOfPgeEePtwmYqWr8lg+Vg7sSrKjLFP/X54o1JJX2dO5YGxM/zBM}

app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

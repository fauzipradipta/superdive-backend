# Prod environment - DB_URL/DB_USERNAME/DB_PASSWORD/JWT_SECRET/CORS_ALLOWED_ORIGINS
# must be supplied as environment variables; no fallback defaults on purpose, so
# a missing secret fails the boot instead of silently using a known value.
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

# "update" until a migration tool (Flyway/Liquibase) is introduced - "validate"
# would refuse to start on a fresh DB since nothing has created the schema yet.
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

logging.level.org.hibernate.SQL=WARN
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=WARN

# Never leak internals to a client.
server.error.include-stacktrace=never
server.error.include-message=never

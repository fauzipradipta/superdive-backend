spring.application.name=backend

# Active environment: local (default), dev, or prod.
# Override with SPRING_PROFILES_ACTIVE - docker-compose sets it from the env file.
spring.profiles.active=${SPRING_PROFILES_ACTIVE:local}

# JWT configuration. No default: dev and prod must provide JWT_SECRET.
# application-local.properties supplies a throwaway one for local runs.
jwt.secret=${JWT_SECRET}
# Token validity in milliseconds (24 hours).
jwt.expiration=${JWT_EXPIRATION:86400000}

spring.jackson.serialization.fail-on-empty-beans=false

# The exact origin the frontend is served from. No default: see local profile.
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS}

# superdive-catalog gRPC service. The backend is a client only; catalog owns
# the product table and is the single writer of it.
superdive.catalog.host=${CATALOG_HOST:localhost}
superdive.catalog.port=${CATALOG_PORT:9090}
# Fail a catalog call rather than holding a request thread open indefinitely.
superdive.catalog.deadline-seconds=${CATALOG_DEADLINE_SECONDS:5}
# The product table stores a bare DECIMAL with no currency column, so every
# row is implicitly this currency. Must match the catalog service setting.
superdive.catalog.currency=${CATALOG_CURRENCY:IDR}
